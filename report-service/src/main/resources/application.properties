spring.application.name=report-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/report_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.healthcheck.enabled=true

eureka.instance.lease-renewal-interval-in-seconds=30

spring.cloud.compatibility-verifier.enabled=false


####
# --- Eureka Service Discovery ---
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Actuator (za Eureka healthcheck) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Report Service
info.app.version=1.0.0