spring.application.name=report-service
server.port=8082

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/report_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/

eureka.client.healthcheck.enabled=true

eureka.instance.lease-renewal-interval-in-seconds=30

spring.cloud.compatibility-verifier.enabled=false


####
# --- Eureka Service Discovery ---
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Actuator (za Eureka healthcheck) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Report Service
info.app.version=1.0.0

# ===================================================================
# --- RabbitMQ Konfiguracija (Zadatak 8) ---
# ===================================================================
# Adresa masine na kojoj radi Docker sa RabbitMQ serverom
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
# Port koji Spring koristi za slanje i primanje poruka
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
# Podrazumijevani login za pristup RabbitMQ
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

#Vrijeme cekanja na povezivanje
spring.rabbitmq.connection-timeout=5000