spring.application.name=interaction-service
server.port=8083

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/interaction_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

########## Eureka Service Discovery ################
# Adrese mikroservisa se NE hardkodiraju — Eureka ih razrješava po imenu (Zadatak 5d)
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

########## Feign Client konfiguracija ################
# Timeouts — sprečava vječno blokiranje ako zavisni servis ne odgovara (Zadatak 5f)
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Aktivira CircuitBreaker fallback za graceful degradation (Zadatak 5f)
spring.cloud.openfeign.circuitbreaker.enabled=true

########### Actuator (za Eureka healthcheck) ####################
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Interaction Service
info.app.version=1.0.0

# ===================================================================
# --- RabbitMQ Konfiguracija (Zadatak 8) ---
# ===================================================================
# Adresa masine na kojoj radi Docker sa RabbitMQ serverom
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
# Port koji Spring koristi za slanje i primanje poruka
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
# Podrazumijevani login za pristup RabbitMQ
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

#Vrijeme cekanja na povezivanje
spring.rabbitmq.connection-timeout=5000
