spring.application.name=interaction-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/interaction_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create

########## Eureka Service Discovery ################
# Adrese mikroservisa se NE hardkodiraju — Eureka ih razrješava po imenu (Zadatak 5d)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

########## Feign Client konfiguracija ################
# Timeouts — sprečava vječno blokiranje ako zavisni servis ne odgovara (Zadatak 5f)
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Aktivira CircuitBreaker fallback za graceful degradation (Zadatak 5f)
spring.cloud.openfeign.circuitbreaker.enabled=true

########### Actuator (za Eureka healthcheck) ####################
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Interaction Service
info.app.version=1.0.0
