spring.application.name=user-service
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- Eureka Service Discovery ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Instanca se identifikuje kao "user-service:8081"
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Actuator (za Eureka healthcheck) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=User Service
info.app.version=1.0.0

# JWT konfiguracija
# secret mora biti identičan kao u api-gateway (application.yml)
# U produkciji: čuvati u environment varijabli, nikad commitovati u git
jwt.secret=NeighborAlertSecretKeyKojaMoraBitiDovoljnoDugaZaHS256Algorithm2024
# Token ističe za 1 sat (3600000 ms)
jwt.expiration-ms=3600000